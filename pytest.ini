[pytest]
testpaths = tests
# Test modules run in parallel processes; a module's tests stay together (module-scoped fixtures, e.g. a Caddy
# container). Live DTM tests stay sequential (tests/conftest.py).
addopts = -n auto --dist loadscope
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live: runs against the real DTM test account (needs .env; local stage 1 only)
    smoke: runs against a deployed instance (needs SMOKE_URL and SMOKE_PASSWORD)
    docker: needs a local Docker daemon (runs the real Caddy image); skipped when Docker is unavailable
    real_kdf: Argon2 at its production cost (elsewhere a cheap but real Argon2 is injected)
