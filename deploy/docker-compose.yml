# Installed to /opt/dtm-demonstrator by install.sh. Values come from .env next to this file.
services:
  app:
    image: ${DEMONSTRATOR_IMAGE}
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./data:/data
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_HOSTS: ${SITE_HOSTS}
      DEFAULT_SNI: ${DEFAULT_SNI}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    # Caddy needs "https://<name>:443, …"; derive it from the one editable key SITE_HOSTS.
    # HTTPS_SUFFIX is the port part of the HTTP → HTTPS redirect target (empty for 443).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export SITE_ADDRESSES="$$(for h in $$SITE_HOSTS; do printf 'https://%s:443, ' "$$h"; done | sed 's/, $$//')";
        export HTTPS_SUFFIX="$$([ "$$HTTPS_PORT" = 443 ] || echo ":$$HTTPS_PORT")";
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/tls:ro
      - ./caddy-data:/data
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

networks:
  internal:
