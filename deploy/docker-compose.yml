# Installed to /opt/dtm-demonstrator by install.sh. Values come from .env next to this file.
services:
  app:
    image: ${DEMONSTRATOR_IMAGE}
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./data:/data
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES}
      DEFAULT_SNI: ${DEFAULT_SNI}
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/tls:ro
      - ./caddy-data:/data
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

networks:
  internal:
