# Installed to /opt/dtm-demonstrator by install.sh. Values come from .env next to this file.
services:
  app:
    image: ${DEMONSTRATOR_IMAGE}
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}  # only an older .env's password, taken over once
      JWT_SECRET: ${JWT_SECRET}
      MINION_LAUNCHER: http://launcher:8080  # UC-8: minions only through the launcher below
    volumes:
      - ./data:/data
    networks: [internal, launcher]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  # Resolves the TLS settings of .env at every start (PEM pair, else PKCS#12) and hands Caddy a checked
  # PEM pair in ./tls-live; on a problem it stops with a clear message and the proxy does not start.
  # An unset path is mounted as /dev/null (read as empty); a set one must exist (no directory is created).
  tls:
    image: ${DEMONSTRATOR_IMAGE}
    restart: "no"
    user: "0"  # writes files the proxy (root, without CAP_DAC_OVERRIDE) can read; reads root-owned keys
    command: ["python", "-m", "app.tls_setup"]
    environment:
      TLS_PKCS12_PASSWORD: ${TLS_PKCS12_PASSWORD:-}
    volumes:
      - {type: bind, source: "${TLS_CERT_FILE:-/dev/null}", target: /tls-in/cert.pem, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${TLS_KEY_FILE:-/dev/null}", target: /tls-in/key.pem, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${TLS_PKCS12_FILE:-/dev/null}", target: /tls-in/keystore.p12, read_only: true, bind: {create_host_path: false}}
      - ./tls-live:/tls
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app: {condition: service_started}
      tls: {condition: service_completed_successfully}
    environment:
      SITE_HOSTS: ${SITE_HOSTS}
      DEFAULT_SNI: ${DEFAULT_SNI}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    # Caddy needs "https://<name>:443, …"; derive it from the one editable key SITE_HOSTS.
    # HTTPS_SUFFIX is the port part of the HTTP → HTTPS redirect target (empty for 443).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export SITE_ADDRESSES="$$(for h in $$SITE_HOSTS; do printf 'https://%s:443, ' "$$h"; done | sed 's/, $$//')";
        export HTTPS_SUFFIX="$$([ "$$HTTPS_PORT" = 443 ] || echo ":$$HTTPS_PORT")";
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls-live:/tls:ro
      - ./caddy-data:/data
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  # UC-8 minions. The launcher alone reaches Docker: it builds every minion container itself (minion image, its
  # network, no mounts, no privileges, labelled with the run) from a few checked values – the web app can ask it
  # for nothing else. The socket proxy restricts the launcher to containers and images; it cannot check bodies,
  # which is why the app does not reach it.
  launcher:
    image: ${DEMONSTRATOR_IMAGE}
    restart: unless-stopped
    command: ["uvicorn", "app.launcher:api", "--host", "0.0.0.0", "--port", "8080", "--no-server-header"]
    healthcheck:  # the image's check targets the web app's port
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
    environment:
      MINION_DOCKER: http://docker:2375
      MINION_IMAGE: dtm-minion:${MINION_VERSION:-26.6.3-567}
      MINION_NETWORK: dtm-minions  # created by install.sh: out to DTM, away from the app
    networks: [launcher, docker-api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  docker:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:  # POST enables every writing method on the allowed paths
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      EVENTS: 0
      VERSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m

networks:
  internal:
  launcher:
    internal: true  # app ↔ launcher only
  docker-api:
    internal: true  # launcher ↔ proxy only
