# Every push: tests. Push to dev: also a preview image :branch-dev (NFR-2).
# Tag v*: tests, release image :vX.Y.Z + :latest, GitHub release with install.sh.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -m "not live and not smoke"
      - run: shellcheck -s bash install.sh scripts/stack-smoke.sh
      # Every release ships with written release notes – checked before any image is published.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: '[ -s "docs/releases/${GITHUB_REF_NAME}.md" ] || { echo "::error::missing release notes docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }'

  # The real compose stack (app, tls, proxy) from this commit's image – catches what unit tests cannot,
  # e.g. bind mounts (v0.3.0: an unset TLS path mounted as /dev/null stopped the proxy).
  stack:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]  # amd64 and arm64 – both are release targets
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t demonstrator:ci .
      - run: scripts/stack-smoke.sh demonstrator:ci

  # The Windows installer: lint and Pester tests of its logic. GitHub's runners have no nested
  # virtualisation, so WSL 2 cannot run here – the real install is verified in VMs (06-platforms.md).
  windows:
    strategy:
      fail-fast: false  # one runner's hiccup must not cancel the other
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          # The PowerShell Gallery fails a download now and then – retry before calling the run red.
          foreach ($attempt in 1..3) {
            try { Install-Module PSScriptAnalyzer, Pester -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop; break }
            catch { if ($attempt -eq 3) { throw }; Write-Warning "Install-Module failed ($_) - retrying"; Start-Sleep 15 }
          }
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer: $($issues.Count) issue(s)" }
          $result = Invoke-Pester -Path tests/windows -PassThru -Output Detailed
          if ($result.FailedCount -gt 0 -or $result.TotalCount -eq 0) { throw "Pester failed" }

  image:
    needs: [test, stack, windows]
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=$image:$GITHUB_REF_NAME,$image:latest" >> "$GITHUB_OUTPUT"
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:branch-$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$GITHUB_REF_NAME-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3  # the arm64 half of the multi-arch image
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" install.sh install.ps1 --title "$GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
