{% extends "base.html" %}
{% block title %}Log in · DTM Demonstrator{% endblock %}
{% block body %}
<body class="auth">
<div class="auth-shell">
  <section class="auth-brand">
    <span class="brand">{{ icon("shield") }}<span class="brand-name">DTM Demonstrator</span></span>
    <div><h1>Device trust, shown live.</h1></div>
    <footer>Version {{ version }}</footer>
  </section>
  <main class="auth-form">
    <div>
      <h2>Log in</h2>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <div class="action-bar"><button type="submit">Log in</button></div>
      </form>
    </div>
  </main>
</div>
</body>
{% endblock %}
