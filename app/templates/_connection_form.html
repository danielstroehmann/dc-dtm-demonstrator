{% if form.error %}<p class="error" role="alert">{{ form.error }}</p>{% endif %}
<form method="post" action="/settings/connections">
  {% if form.id %}<input type="hidden" name="id" value="{{ form.id }}">{% endif %}
  <div class="field-row">
    <label>Name
      <input name="name" value="{{ form.name or '' }}" required maxlength="40" placeholder="e.g. US demo">
    </label>
    <label>Host
      <input name="host" value="{{ form.host or '' }}" required pattern="[a-z0-9.\-]+\.[a-z]{2,}">
    </label>
  </div>
  <label>Account ID
    <input name="account_id" value="{{ form.account_id or '' }}" required placeholder="UUID of the DTM account">
  </label>
  <label>API key {% if form.has_key %}<small class="muted">(configured – leave empty to keep it)</small>{% endif %}
    <input type="password" name="api_key" autocomplete="off" {% if not form.has_key %}required{% endif %}>
  </label>
  <div class="action-bar">
    {% if form.id %}<a href="/settings" class="link">Cancel</a>{% endif %}
    <button type="submit" {% if not connections %}class="cta"{% endif %}>Check and save</button>
  </div>
</form>
